name: Partner-Säulen aktualisieren
on:
  schedule:
    - cron: '23 3 * * 1'   # montags früh
  workflow_dispatch:
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Ladesäulenregister laden
        run: python3 scripts/build_partners.py
      - name: Speichern
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add partners.json
          git diff --cached --quiet || (git commit -m "Partner-Säulen aktualisiert" && git push)
